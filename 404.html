<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>页面不存在 · WeederRobert 的记事本</title>
<script>
  (function () {
    try {
      var saved = localStorage.getItem('blog-theme');
      var theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.dataset.theme = theme;
    } catch (error) {}
  })();
</script>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header class="site-header">
  <a class="brand" href="index.html">WeederRobert 的记事本</a>
  <nav class="site-nav" aria-label="主导航">
    <a href="index.html">文章</a>
    <a href="about.html">关于</a>
  </nav>
  <button class="theme-toggle" type="button" data-theme-toggle aria-label="切换深浅色">☾</button>
</header>
<main id="main">
  <article class="post">
    <header class="post-header">
      <h1>404</h1>
      <p class="post-meta">这个地址没有内容</p>
    </header>
    <div class="post-body">
      <p>可能是链接写错了，或者文章已经改名。回到 <a href="index.html">文章列表</a> 看看。</p>
    </div>
  </article>
</main>
<footer class="site-footer page-footer">
  <span>© <span data-year>2026</span> WeederRobert</span>
  <span><a href="feed.xml">RSS</a></span>
</footer>
<script src="assets/app.js" defer></script>
</body>
</html>
